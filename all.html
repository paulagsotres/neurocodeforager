<body>

<nav class="site-nav" id="site-nav"></nav>

<section class="cat-header">
  <a class="back" href="index.html">&larr; home</a>
  <h1>All tools</h1>
  <p id="all-count"></p>
</section>

<section class="results">
  <div class="results-list" id="all-list"></div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/icons.js"></script>
<script src="assets/categories.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/app.js"></script>
<script>
  async function initAllPage(){
    const list = document.getElementById('all-list');
    const count = document.getElementById('all-count');
    let entries;
    try {
      entries = await loadEntries();
    } catch(err) {
      list.innerHTML = '<div class="empty-state" style="color:#a6472a;">' + err.message + '</div>';
      return;
    }
    const sorted = entries.slice().reverse();
    count.textContent = sorted.length + ' tools indexed';
    renderCards(list, sorted);
  }
  document.addEventListener('DOMContentLoaded', initAllPage);
</script>
</body>
